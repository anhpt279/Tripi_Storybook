name: Publish package

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version release type'
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major
          - prerelease

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Resolve available version
        run: |
          set -euo pipefail

          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if [ "${{ inputs.release }}" != "current" ]; then
            npm version "${{ inputs.release }}" --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSIONS=$(npm view "${PACKAGE_NAME}" versions --json --registry=https://registry.npmjs.org)

          while node -e '
            const published = JSON.parse(process.argv[1]);
            const versions = Array.isArray(published) ? published : [published];
            process.exit(versions.includes(process.argv[2]) ? 0 : 1);
          ' "${PUBLISHED_VERSIONS}" "${VERSION}"; do
            echo "Version ${VERSION} already exists. Bumping patch version."
            npm version patch --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
          done

          echo "Publishing ${PACKAGE_NAME}@${VERSION}"

      - name: Build library
        run: npm run build:lib

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is missing or empty."
            exit 1
          fi

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
