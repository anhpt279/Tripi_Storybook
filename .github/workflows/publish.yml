name: Publish package

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Version release type'
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major
          - prerelease

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm
        run: npm install --global npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Resolve available version
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")

          if [ "${{ inputs.release }}" != "current" ]; then
            npm version "${{ inputs.release }}" --no-git-tag-version
          fi

          VERSION=$(node -p "require('./package.json').version")

          while npm view "${PACKAGE_NAME}@${VERSION}" version --registry=https://registry.npmjs.org >/dev/null 2>&1; do
            echo "Version ${VERSION} already exists. Bumping patch version."
            npm version patch --no-git-tag-version
            VERSION=$(node -p "require('./package.json').version")
          done

          echo "Publishing ${PACKAGE_NAME}@${VERSION}"

      - name: Build library
        run: npm run build:lib

      - name: Check npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is missing or empty."
            exit 1
          fi

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
